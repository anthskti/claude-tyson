<!doctype html><html lang="en"><meta charset="utf-8"><title>Boxing CV integration check</title>
<style>body{background:#101923;color:#eef4f8;font:16px system-ui;max-width:1000px;margin:32px auto;padding:0 20px}button,input{font:inherit;padding:8px;margin:4px}canvas{background:#1e3040;width:100%;max-width:640px}pre{white-space:pre-wrap;color:#aee7c8}small{color:#b7c6d0}</style>
<h1>Local CV integration check</h1><p>Movement attempts only. Combat outcomes belong to SpacetimeDB.</p>
<p><input id="fight" value="mvp-fight" aria-label="Fight ID"><input id="round" value="round-1" aria-label="Round ID"><button id="connect">Connect</button><button id="reset">Reset head/history</button></p>
<p id="state">Disconnected</p><canvas id="view" width="640" height="480"></canvas><pre id="metrics"></pre><pre id="events"></pre>
<small>Mirrored markers; no video stream. Synthetic/replay data is labeled and is not a camera-latency measurement. The page never opens a camera.</small>
<script type="module">
import { CvProvider } from './cv-provider.js';
const byId=id=>document.getElementById(id),canvas=byId('view'),ctx=canvas.getContext('2d');let provider,history=[],samples=[];
const clear=reason=>{ctx.clearRect(0,0,640,480);byId('state').textContent=reason;};
byId('connect').onclick=async()=>{
 provider?.close();history=[];samples=[];
 provider=new CvProvider({url:new URLSearchParams(location.search).get("ws")||"ws://127.0.0.1:8765",allowTestInput:true,onState:s=>byId('state').textContent=s,onReset:clear,onSample:({sample,events,canScore,latency})=>{
  ctx.clearRect(0,0,640,480);
  for(const [name,p] of Object.entries(sample.observation.markers)){ctx.fillStyle=name==='head'?'#ffd375':'#65ddcc';ctx.beginPath();ctx.arc((1-p.x)*640,p.y*480,12,0,Math.PI*2);ctx.fill();ctx.fillText(name,(1-p.x)*640+15,p.y*480);}
  if(latency)samples.push(latency.sampleToReceiveMs);if(samples.length>300)samples.shift();const sorted=[...samples].sort((a,b)=>a-b);
  byId('state').textContent=`${sample.source.toUpperCase()} • ${sample.observation.trackingState} • scoring ${canScore?'enabled for test':'paused'}`;
  byId('metrics').textContent=JSON.stringify({seq:sample.seq,batch:sample.batch,validity:sample.observation.validity,punchReadiness:sample.observation.punchReadiness,
   resetGeneration:sample.producer.resetGeneration,clockOffsetMs:provider.offset,clockUncertaintyMs:provider.uncertainty,
   latency,receiveAgeP95:sorted.length?sorted[Math.ceil(sorted.length*.95)-1]:null},null,2);
  for(const e of events)history.unshift(`${e.sampleMs.toFixed(0)}ms ${e.type} ${e.eventId}`);history=history.slice(0,10);byId('events').textContent=history.join('\n');
 }});
 try{await provider.connect({fightId:byId('fight').value,roundId:byId('round').value});}catch(e){clear(String(e));}
};
byId('reset').onclick=()=>provider?.resetCalibration().catch(e=>clear(String(e)));
</script></html>
