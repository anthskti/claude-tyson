[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "boxing-cv-mvp"
version = "0.1.0"
description = "Local OpenCV/MediaPipe boxing CV provider and MVP contract bridge"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["websockets==15.0.1"]
[project.optional-dependencies]
camera = ["mediapipe==0.10.21", "opencv-contrib-python==4.11.0.86", "numpy==1.26.4", "jax==0.4.35", "jaxlib==0.4.35", "protobuf==4.25.3", "matplotlib==3.10.1"]
dev = ["pytest==8.3.5"]
[project.scripts]
boxing-cv-mvp = "cv_mvp.__main__:main"
[tool.setuptools.packages.find]
include = ["cv_mvp*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
